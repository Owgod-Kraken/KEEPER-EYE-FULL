name: keeper_eye_app
description: "Keeper-Eye - Guía segura en cada paso. App de accesibilidad con OCR, detección de obstáculos y lectura por voz."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_object_detection: ^0.14.0
  flutter_tts: ^4.2.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  permission_handler: ^11.4.0
  vibration: ^2.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
